---
- name: Prepare
  hosts: all
  become: true

  tasks:
    - name: Select the SELinux package | RedHat
      set_fact:
        prepare_selinux_package: selinux-policy
      when: ansible_facts['os_family'] == "RedHat"

    - name: Select the SELinux package | Debian
      set_fact:
        prepare_selinux_package: selinux-basics
      when: ansible_facts['os_family'] == "Debian"

    # Docker images do not include SELinux, adding
    - name: Install SELinux
      package:
        name: "{{ item }}"
        state: present
      with_items: "{{ prepare_selinux_package }}"
